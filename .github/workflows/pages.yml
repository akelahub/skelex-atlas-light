name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read is the workflow default. Write scopes stay on the job that needs them.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Export web
        run: ./node_modules/.bin/expo export --platform web
        env:
          EXPO_NO_TELEMETRY: "1"
          # Project site: https://akelahub.github.io/skelex-atlas-light/
          EXPO_BASE_URL: /skelex-atlas-light
          EXPO_WEB_OUTPUT: static

      - name: Prepare Pages files
        run: node scripts/prepare-pages.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
